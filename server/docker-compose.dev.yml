# 本地联调依赖：一键启动 PostgreSQL 16 + Redis 7 供 Orbit Go (Gin + GORM) 后端本地测试
services:
  postgres:
    image: postgres:16-alpine
    container_name: lec-orbit-dev-pg
    environment:
      POSTGRES_DB: lec_orbit_dev
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_dev_password
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d lec_orbit_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: lec-orbit-dev-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
