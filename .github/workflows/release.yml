name: 构建并发布 Orbit 桌面端制品

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否同时发布到 GitHub Releases（仅手动触发有效）'
        type: boolean
        default: false
      release_tag:
        description: '手动发布时的版本号标签（例如 v0.1.0）'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  verify:
    name: 类型检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出 lec-orbit
        uses: actions/checkout@v4
        with:
          path: apps/lec-orbit
      - name: 检出共享图标库 @lec-space/icons
        uses: actions/checkout@v4
        with:
          repository: lec-org/lec-icons
          path: packages/icons
      - name: 检出组件库 @lec-space/liquidglass
        uses: actions/checkout@v4
        with:
          repository: lec-org/liquidglass
          path: packages/liquidglass
      - name: 安装 Node 22 与 Bun
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖并校验 TypeScript 与单元测试
        working-directory: apps/lec-orbit
        run: |
          bun install --no-save
          bun run typecheck
          bun run test
          bun run build
      - name: 安装 Go 并运行服务端测试
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/lec-orbit/server/go.sum
      - name: Go 后端单测与编译检查
        working-directory: apps/lec-orbit/server
        run: |
          go test ./...
          go build ./cmd/orbit-server

  package:
    name: 打包 ${{ matrix.label }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (arm64 + x64)
            os: macos-latest
            platform: mac
            artifact: orbit-mac
          - label: Windows (x64)
            os: windows-latest
            platform: win
            artifact: orbit-win
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出 lec-orbit
        uses: actions/checkout@v4
        with:
          path: apps/lec-orbit
      - name: 检出共享图标库 @lec-space/icons
        uses: actions/checkout@v4
        with:
          repository: lec-org/lec-icons
          path: packages/icons
      - name: 检出组件库 @lec-space/liquidglass
        uses: actions/checkout@v4
        with:
          repository: lec-org/liquidglass
          path: packages/liquidglass
      - name: 可选检出 LecDoc 源码（配置 LEC_DOC_TOKEN 时内置离线包）
        shell: bash
        env:
          LEC_DOC_TOKEN: ${{ secrets.LEC_DOC_TOKEN }}
        run: |
          if [ -n "$LEC_DOC_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${LEC_DOC_TOKEN}@github.com/lec-org/lec-doc.git" apps/lec-doc
          else
            echo "未配置 LEC_DOC_TOKEN，跳过离线 LecDoc 打包（运行时自动回退远程模式）"
          fi
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        working-directory: apps/lec-orbit
        run: bun install
      - name: 准备内置 LecDoc 前端资源（若存在则构建，否则回退远程模式）
        working-directory: apps/lec-orbit
        shell: bash
        run: |
          if [ -d "../lec-doc/apps/lec-doc" ]; then
            (cd ../lec-doc/apps/lec-doc && bun install && cd - >/dev/null)
            node scripts/bundle-lec-doc.mjs
          else
            node scripts/bundle-lec-doc.mjs --allow-missing
          fi
      - name: 构建 Electron 产物
        working-directory: apps/lec-orbit
        run: bun run build
      - name: 打包 macOS 制品（DMG + ZIP，arm64 & x64）
        if: matrix.platform == 'mac'
        working-directory: apps/lec-orbit
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: 打包 Windows 制品（NSIS x64）
        if: matrix.platform == 'win'
        working-directory: apps/lec-orbit
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --x64 --publish never
      - name: 整理发布文件列表
        working-directory: apps/lec-orbit
        shell: bash
        run: |
          mkdir -p release-upload
          find release -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.blockmap" -o -name "latest*.yml" \) -exec cp {} release-upload/ \;
          ls -lh release-upload/
      - name: 上传构建制品
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/lec-orbit/release-upload/*
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部平台制品
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 生成 SHA256 校验清单
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - name: 创建或更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: Orbit ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: artifacts/*
